<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RutCloud | Получить файл</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .container p {
            margin: 0;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: #000000;
        }

        .logo img {
            width: 150px;
            height: 150px;
        }

        .logo p {
            margin-bottom: 25px;
        }

        .qrcode img {
            margin-bottom: 25px;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="logo">
        <img src="https://cdn2.iconfinder.com/data/icons/apple-inspire-white/100/Apple-36-1024.png" alt="RutCloud Logo">
        <p>RutCloud</p>
    </div>
    <div class="qrcode">
        <img src="/qr-code" alt="QR-code">
        <p>Отправьте QR-code для получения файлов</p>
    </div>
</div>
</body>
</html>
