<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head th:replace="fragments/head"/>
<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<div th:replace="fragments/navbar">Navbar</div>

<!-- Main Content -->
<main class="container mt-4">
	<script>
		function myFunction(short_url) {
			navigator.clipboard.writeText(short_url.innerText).then(function() {
				console.log(`Текст успешно скопирован в буфер обмена (${short_url.innerText})`);
			}, function(err) {
				console.error('Произошла ошибка при копировании текста: ', err);
			});
		}
		// Функция для обработки события сканирования QR-кода
		function handleQRCodeScan(qrCodeValue) {
			// Отправка AJAX-запроса на сервер с данными QR-кода
			$.ajax({
				url: '/files/' + qrCodeValue, // Путь к обработчику запроса на сервере
				type: 'GET',
				success: function(response) {
					// Обработка успешного ответа от сервера
					console.log('QR Code scanned successfully:', response);
				},
				error: function(xhr, status, error) {
					// Обработка ошибок
					console.error('Error scanning QR Code:', error);
				}
			});
		}
	</script>
	<!-- QR Code Section -->
	<section class="qr-code-section">
		<h2 class="section-title">QR Code</h2>
		<img src="/qr-code" alt="QR Code">
	</section>

	<!-- File Upload Section -->
	<section class="upload-section mt-4">
		<h2 class="section-title">Upload File</h2>
		<form method="POST" enctype="multipart/form-data" action="/">
			<div class="mb-3">
				<label for="fileUpload" class="form-label">Choose a file:</label>
				<input type="file" class="form-control" id="fileUpload" name="file" />
			</div>
			<button type="submit" class="btn btn-primary">Upload</button>
		</form>
	</section>

	<!-- File List Section -->
	<div class="row row-cols-1 g-4">
		<div th:each="file : ${files}" class="col">
			<div class="card">
				<div class="card-body">
					<h5 class="card-title" th:text="${file.toString()}" id="short_url"></h5>
					<p class="card-text">
						<strong>Posted by:</strong> <!-- Add more details as needed -->
					</p>
					<div class="button-group">
						<a th:href="${file}" class="btn btn-primary">Download</a>
						<a th:href="@{{file}/delete(file=${file})}" class="btn btn-danger">Delete</a>
						<button onclick="myFunction(document.getElementById('short_url'))">Copy</button>
						<link rel="stylesheet" href="">
					</div>
				</div>
			</div>
		</div>
	</div>
</main>

<!-- Footer -->
<footer th:replace="fragments/footer"/>

</body>
</html>
