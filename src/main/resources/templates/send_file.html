<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RutCloud | Отправить файл</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .container p {
            margin: 0;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: #000000;
        }

        .logo img {
            width: 150px;
            height: 150px;
        }

        .qrcode p {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .qrcode input {
            width: 200px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .qrcode a {
            display: inline-block;
            text-align: center;
            width: 50px;
            padding: 11px;
            font-size: 16px;
            text-decoration: none;
            color: #ffffff;
            background-color: #00c62e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .qrcode a:hover {
            background-color: #00af29;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="logo">
        <img src="https://cdn2.iconfinder.com/data/icons/apple-inspire-white/100/Apple-36-1024.png" alt="RutCloud Logo">
        <p>RutCloud</p>
    </div>
    <div class="qrcode">
        <p>Отсканируйте QR-code для отправления файлов</p>
        <p>Или введите короткую ссылку</p>
        <input type="text" id="shortlink" placeholder="Введите ссылку:">
        <a href="/">Далее</a>
    </div>
</div>
</body>
</html>
