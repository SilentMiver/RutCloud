<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RutCloud</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .container p {
            margin: 0;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: #000000;
        }

        .logo img {
            width: 150px;
            height: 150px;
        }

        .btn {
            display: block;
            width: 200px;
            margin: 10px auto;
            padding: 12px 24px;
            font-size: 20px;
            text-decoration: none;
            color: #ffffff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn.send {
            background-color: #00c62e;
        }

        .btn.send:hover {
            background-color: #00af29;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="logo">
        <img src="https://cdn2.iconfinder.com/data/icons/apple-inspire-white/100/Apple-36-1024.png" alt="RutCloud Logo">
        <p>RutCloud</p>
    </div>
    <a href="/send_file" class="btn send">Отправить файл</a>
    <a href="/get_file" class="btn">Получить файл</a>
</div>
</body>
</html>
