version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis-for-rut-cloud
    ports:
      - "6379:6379"
    restart: always
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: rutcloud_files
      POSTGRES_USER: rutuser
      POSTGRES_PASSWORD: miit
    ports:
      - "5432:5432"
