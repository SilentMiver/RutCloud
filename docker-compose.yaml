version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis-for-rut-cloud
    ports:
      - "6379:6379"
    restart: always
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ACCESS_KEY: access_key
      MINIO_SECRET_KEY: secret_key
    volumes:
      - minio_data:/data
    command: server /data

volumes:
  minio_data: